    <style>
      :root {
        --safe-area-inset-top: env(safe-area-inset-top, 0px);
        --safe-area-inset-right: env(safe-area-inset-right, 0px);
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-inset-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 218, 180, 0.16), transparent 24%),
          radial-gradient(circle at 80% 18%, rgba(170, 210, 255, 0.18), transparent 22%),
          linear-gradient(180deg, #1e2438 0%, #151a2c 52%, #101420 100%);
      }
      #app {
        position: relative;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
      }
      #game-container {
        position: absolute;
        top: var(--safe-area-inset-top);
        right: var(--safe-area-inset-right);
        left: var(--safe-area-inset-left);
        width: auto;
        height: calc(100dvh - var(--safe-area-inset-top) - var(--safe-area-inset-bottom));
        margin: 0 auto;
        min-width: 320px;
        overflow: hidden;
        background: #0f1728;
      }
      #boot-loader {
        position: absolute;
        inset: 0;
        z-index: 9999;
        background:
          linear-gradient(180deg, rgba(17, 24, 38, 0.22), rgba(17, 24, 38, 0.42)),
          url('./assets/ui-shell/bootstrap_bg.webp') center center / 100% 100% no-repeat,
          #151a2c;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.25s ease;
      }
      #boot-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* Прогресс-бар рисуется статикой в разметке — виден сразу с фоном, без
         задержки до первой JS-вехи. bootLoader.ts переиспользует .boot-progress-fill. */
      .boot-progress {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(90%, 780px);
        height: 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.22);
        overflow: hidden;
      }
      .boot-progress-fill {
        position: relative;
        height: 100%;
        width: 0%;
        border-radius: 999px;
        overflow: hidden;
        /* Near-white (близко к белому). */
        background: linear-gradient(90deg, #e4eaff 0%, #ffffff 100%);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        transition: width 600ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      /* Бегущий блик — бар «живой» даже на сетевых паузах. transform = composite-only. */
      .boot-progress-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, 0.9) 50%, transparent 80%);
        transform: translateX(-100%);
        animation: boot-progress-sheen 1.4s ease-in-out infinite;
      }
      @keyframes boot-progress-sheen {
        from { transform: translateX(-100%); }
        to { transform: translateX(100%); }
      }
    </style>
