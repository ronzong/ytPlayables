<!DOCTYPE html>
<html lang="en-us">
  <head>
    <script src="https://www.youtube.com/game_api/v1"></script>
    <script src="yt-bridge.js"></script>
    <script src="Build/brotli-decode.js"></script>
    <meta charset="utf-8">
    <!-- 使用实际设备宽度，保持原游戏的全屏布局与触摸坐标一致。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Drifter.Star.Evolution</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="stylesheet" href="TemplateData/yt-layout.css">
    <script>
      // Facebook 等平台可能通过 Permissions Policy 禁止 iframe 使用 Gamepad API。
      // Unity 旧输入系统会主动轮询该接口，因此在加载 Unity 前将权限异常降级为“无手柄”。
      (function () {
        var originalGetGamepads = navigator.getGamepads;
        if (typeof originalGetGamepads !== "function") {
          return;
        }

        var isGamepadBlocked = false;
        var permissionsPolicy = document.permissionsPolicy || document.featurePolicy;
        if (permissionsPolicy && typeof permissionsPolicy.allowsFeature === "function") {
          try {
            isGamepadBlocked = !permissionsPolicy.allowsFeature("gamepad");
          } catch (error) {
            isGamepadBlocked = false;
          }
        }

        navigator.getGamepads = function () {
          if (isGamepadBlocked) {
            return [];
          }

          try {
            return originalGetGamepads.call(navigator);
          } catch (error) {
            if (error && error.name === "SecurityError") {
              isGamepadBlocked = true;
              return [];
            }

            throw error;
          }
        };
      })();
    </script>


    <script>
      // Unity 可在点击回调中直接调用浏览器 API，统一在页面边界拦截。
      ['requestFullscreen', 'webkitRequestFullscreen', 'webkitRequestFullScreen', 'mozRequestFullScreen', 'msRequestFullscreen'].forEach(function (name) {
        if (typeof Element.prototype[name] === 'function') {
          Element.prototype[name] = function () { return Promise.resolve(); };
        }
      });
    </script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=540 height=960></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Drifter.Star.Evolution</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebBuild.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebBuild.data.unityweb",
        frameworkUrl: buildUrl + "/WebBuild.framework.js.unityweb",
        codeUrl: buildUrl + "/WebBuild.wasm.brotli",
        symbolsUrl: buildUrl + "/WebBuild.symbols.json.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Drifter.Star.Evolution",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      //   container.className = "unity-mobile";
      //   // Avoid draining fillrate performance on mobile devices,
      //   // and default/override low DPI mode on mobile browsers.
      //   config.devicePixelRatio = 1;
      //   unityShowBanner('WebGL builds are not supported on mobile devices.');
      // } else {
      //   canvas.style.width = "540px";
      //   canvas.style.height = "1200px";
      // }

      // 改成unity-mobile，使之全屏显示，否则默认是横屏
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
      // 固定逻辑分辨率，CSS 只做等比缩放，避免横屏改变游戏 UI 布局。
      config.matchWebGLToCanvasSize = false;
      loadingBar.style.display = "block";

      function startUnity(){
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
            // 资源加载完成后由 Unity 内部启动画面接管，先隐藏网页进度条。
            if (progress >= 1) loadingBar.style.display = "none";
          }).then((unityInstance) => {
            window.localBootReady(unityInstance, loadingBar, canvas);
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);              
            };
            window.unityInstance = unityInstance;
          }).catch((message) => {
            console.error("[yt] Unity 启动失败", message);
            unityShowBanner("游戏加载失败，请刷新重试。", "error");
          });
        };
        document.body.appendChild(script);
      }

      instgame.initializeAsync()
        .then(function () {

            console.info("instgame initializeAsync..");
            // 记录启动来源
            instgame.getEntryPointAsync().then(function(entry){
                console.info("Entry Point: ", entry);
            });

            // 记录会话类型
            const contextType = instgame.context.getType();
            console.info("Context Type: ", contextType);

            instgame.startGameAsync()
              .then(function () {
                  startUnity();
                  instgame.onGameEvent("instgame_start", ""); // 游戏开始事件
                  console.info("instgame startGameAsync..");
              })
              .catch(function (e) { cc.error(e); });

        });
      
    </script>
  </body>
</html>
