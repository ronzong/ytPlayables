        const isLocalhost = /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname);
const isRSHubDomain = /^(.*\.)?rshub\.io$/.test(window.location.hostname);
const isInIframe = window.self !== window.top;
const httpsPort = 8009;

function loadScript(url, attributes = {}) {
    return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        for (const key in attributes) {
            script.setAttribute(key, attributes[key]);
        }
        script.onload = resolve;
        script.onerror = (error) => reject(new Error(`Failed to load script: ${url}`));
        document.head.appendChild(script);
    });
}

function getBackoff(attempts, maxAttempts, maxBackoff) {
    return 1000 + ((attempts - 1) / (maxAttempts - 1)) * (maxBackoff - 1000);
}

function loadScriptWithRetry(url, maxAttempts = 50, maxBackoff = 3000) {
    let attempts = 0;

    function attemptLoad() {
        return loadScript(url).catch(() => {
            attempts++;
            if (attempts >= maxAttempts) throw new Error(`Failed to load script after ${maxAttempts} retries: ${url}`);
            return new Promise((resolve, reject) => {
                setTimeout(() => attemptLoad().then(resolve).catch(reject), getBackoff(attempts, maxAttempts, maxBackoff));
            });
        });
    }

    return attemptLoad();
}

function getRootPath() {
    let url = window.location.href;
    let urlObj = new URL(url);
    let path = urlObj.pathname;
    // Remove the trailing slash if it exists
    if (path.endsWith('/')) {
        path = path.slice(0, -1);
    }
    // Get the folder path
    let folderPath = path.substring(0, path.lastIndexOf('/'));
    return urlObj.origin + folderPath;
}


function sentryInit(dsn, platform, releaseVersion, buildNum) {
    return new Promise((resolve, reject) => {
        Sentry.init({
            dsn,
            release: releaseVersion + '@' + buildNum,
            dist: "web",
            integrations: [
                Sentry.captureConsoleIntegration(
                    {
                        levels: ['error', 'warn']
                    }
                ),
                Sentry.httpClientIntegration(
                    {
                        failedRequestStatusCodes: [[400, 599]],
                    }
                ),
                Sentry.rewriteFramesIntegration({
                    iteratee: (frame) => {
                        if (typeof window['rewriteFrame'] === 'function') {
                            window['rewriteFrame'](frame);
                        } else {
                            if (!frame.filename) {
                                return frame;
                            }
                            const rootPath = getRootPath() + "/";
                            if (frame.filename.startsWith(rootPath)) {
                                frame.filename = "app:///" + frame.filename.replace(rootPath, "");
                            }
                            return frame;
                        }
                        return frame;
                    }
                })
            ],
            tracesSampleRate: 1,// 0.33,
            sendDefaultPii: true,
            attachStacktrace: true,
            maxBreadcrumbs: 250,
            // debug: true,
            beforeSend(event, hint) {
                if (event && event.event_id) {
                    // Check if there's an original exception and a stack trace
                    let stackTrace = hint && hint.originalException && hint.originalException.stack ? hint.originalException.stack : 'No stack trace available';
                    // Check if there's an error message in the hint.captureContext.extra.arguments[0]
                    let errorMessage = hint && hint.captureContext && hint.captureContext.extra && hint.captureContext.extra.arguments && hint.captureContext.extra.arguments.length > 0 ? hint.captureContext.extra.arguments[0] : 'No error message available';
                    // Log the error information and stack trace in the same console log
                    console.log(`[SentryError]: ${event.event_id},\n${errorMessage}\n${stackTrace}`);
                }
                if (typeof window['sentryBeforeSend'] === 'function') {
                    try {
                        window['sentryBeforeSend'](event, hint);
                    } catch (e) {
                        // ignored
                    }
                }
                return event;
            },
            initialScope: {
                tags: {
                    platform
                }
            }
        });
        window['testError'] = () => {
            throw new Error("TestError");
        };

        resolve();
    });
}
        const APP_LAUNCHER_LIGHT = 'db://assets/scenes/appLauncherLight.scene';

        /**
         * Keeps `--app-height` aligned with the visible viewport height.
         * iOS Chrome reports `100vh` against the larger layout viewport, so when
         * the browser bars are visible the game gets vertically centered inside
         * too much space and ends up shifted under the bottom toolbar.
         */
        (function syncViewportSize() {
            const root = document.documentElement;
            const viewport = window.visualViewport;
            let lastEngineViewportWidth = null;
            let lastEngineViewportHeight = null;
            let lastStableViewportWidth = null;
            let lastStableViewportHeight = null;
            let keyboardViewportLocked = false;
            let resizeKickPending = false;
            const KEYBOARD_MIN_HEIGHT_DELTA = 120;
            const getViewportSize = () => ({
                width: Math.round(viewport?.width ?? window.innerWidth),
                height: Math.round(viewport?.height ?? window.innerHeight),
            });
            const hasEditableFocus = () => {
                const element = document.activeElement;

                return element instanceof HTMLElement && (
                    element.tagName === 'INPUT' ||
                    element.tagName === 'TEXTAREA' ||
                    element.isContentEditable ||
                    element.classList.contains('cocosEditBox')
                );
            };
            const resolveKeyboardViewportState = (viewportSize) => {
                if (lastStableViewportHeight === null) {
                    keyboardViewportLocked = false;
                    return false;
                }

                const keyboardHeightDelta = lastStableViewportHeight - viewportSize.height;
                const keyboardHeightThreshold = Math.max(KEYBOARD_MIN_HEIGHT_DELTA, lastStableViewportHeight * 0.15);
                const isKeyboardViewport = keyboardHeightDelta > keyboardHeightThreshold && (hasEditableFocus() || keyboardViewportLocked);
                keyboardViewportLocked = isKeyboardViewport;

                return isKeyboardViewport;
            };
            const getEngineViewportState = () => {
                const viewportSize = getViewportSize();
                const isKeyboardViewport = resolveKeyboardViewportState(viewportSize);

                if (isKeyboardViewport) {
                    return {
                        width: lastStableViewportWidth ?? viewportSize.width,
                        height: lastStableViewportHeight ?? viewportSize.height,
                        isKeyboardViewport: true,
                    };
                }

                lastStableViewportWidth = viewportSize.width;
                lastStableViewportHeight = viewportSize.height;

                return {
                    width: viewportSize.width,
                    height: viewportSize.height,
                    isKeyboardViewport: false,
                };
            };
            const updateKeyboardOffset = (isKeyboardViewport) => {
                const keyboardOffsetTop = isKeyboardViewport ? Math.round(viewport?.offsetTop ?? 0) : 0;
                root.style.setProperty('--keyboard-offset-top', `${keyboardOffsetTop}px`);

                if (isKeyboardViewport && window.scrollY !== 0) {
                    window.scrollTo(0, 0);
                }
            };
            const updateViewportSize = () => {
                const { height, isKeyboardViewport } = getEngineViewportState();
                root.style.setProperty('--app-height', `${height}px`);
                updateKeyboardOffset(isKeyboardViewport);

                return isKeyboardViewport;
            };
            const handleWindowResize = (event) => {
                if (updateViewportSize()) {
                    event.stopImmediatePropagation();
                }
            };
            const syncViewportSizeAndKickEngine = () => {
                const { width, height, isKeyboardViewport } = getEngineViewportState();
                const viewportChanged = width !== lastEngineViewportWidth || height !== lastEngineViewportHeight;

                root.style.setProperty('--app-height', `${height}px`);
                updateKeyboardOffset(isKeyboardViewport);

                if (isKeyboardViewport) {
                    return;
                }

                if (!viewportChanged || resizeKickPending) {
                    return;
                }

                resizeKickPending = true;
                requestAnimationFrame(() => {
                    const latestViewportSize = getViewportSize();
                    lastEngineViewportWidth = latestViewportSize.width;
                    lastEngineViewportHeight = latestViewportSize.height;
                    resizeKickPending = false;
                    window.dispatchEvent(new Event('resize'));
                });
            };

            window.addEventListener('resize', handleWindowResize, true);
            window.addEventListener('orientationchange', updateViewportSize);
            window.addEventListener('load', syncViewportSizeAndKickEngine);
            window.addEventListener('pageshow', syncViewportSizeAndKickEngine);
            window.addEventListener('focusout', () => {
                requestAnimationFrame(syncViewportSizeAndKickEngine);
                setTimeout(syncViewportSizeAndKickEngine, 150);
                setTimeout(syncViewportSizeAndKickEngine, 400);
            });

            if (viewport) {
                viewport.addEventListener('resize', syncViewportSizeAndKickEngine);
                viewport.addEventListener('scroll', syncViewportSizeAndKickEngine);
            }

            updateViewportSize();
            requestAnimationFrame(syncViewportSizeAndKickEngine);
            setTimeout(syncViewportSizeAndKickEngine, 150);
            setTimeout(syncViewportSizeAndKickEngine, 400);
        })();
    </script>
