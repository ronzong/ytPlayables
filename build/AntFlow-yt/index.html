<script>
    (function () {
      function applyBootstrapViewport() {
        var root = document.documentElement;
        var visual = window.visualViewport;
        var width = Math.max(
          1,
          Math.round(window.innerWidth || 0),
          Math.round(root.clientWidth || 0),
          Math.round(visual ? visual.width : 0)
        );
        var height = Math.max(
          1,
          Math.round(window.innerHeight || 0),
          Math.round(root.clientHeight || 0),
          Math.round(visual ? visual.height : 0)
        );

        root.style.setProperty("--game-viewport-width", width + "px");
        root.style.setProperty("--game-viewport-height", height + "px");
      }

      window.__applyYandexBootstrapViewport = applyBootstrapViewport;
      applyBootstrapViewport();
      window.addEventListener("resize", applyBootstrapViewport, { passive: true });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", applyBootstrapViewport, { passive: true });
      }
      window.requestAnimationFrame(applyBootstrapViewport);
    })();
  </script>
