<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>iframe host harness</title>
  <style>
    html, body { margin: 0; height: 100%; background: #222; }
    iframe { border: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!--
    本地对照用的宿主页：把游戏放在跨域 iframe 里加载，用于复现“游戏在 iframe 里”这一条件。
    沙箱属性可通过 ?sandbox=... 覆盖，默认与 YouTube 测试套件一致。
  -->
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var game = params.get('game') || 'https://localhost:8002/';
      var sandbox = params.get('sandbox');
      if (sandbox === null) sandbox = 'allow-pointer-lock allow-same-origin allow-scripts';
      var frame = document.createElement('iframe');
      frame.id = 'game-frame';
      frame.setAttribute('allow', 'autoplay');
      if (sandbox !== 'none') frame.setAttribute('sandbox', sandbox);
      var w = params.get('w');
      var h = params.get('h');
      if (w) frame.style.width = w + 'px';
      if (h) frame.style.height = h + 'px';
      frame.src = game;
      document.body.appendChild(frame);
      var loadTimes = Number(params.get('load') || 1);
      if (loadTimes > 1) {
        // 复现测试套件的行为：输入框的 input 事件先加载一次，随后点刷新又重载一次
        setTimeout(function () {
          frame.src = '';
        }, 300);
        setTimeout(function () {
          frame.src = game;
        }, 400);
      }
    })();
  </script>
</body>
</html>
